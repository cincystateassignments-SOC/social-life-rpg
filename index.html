<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062d25"><title>Social Life — A Sociology RPG</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="shell">
  <header class="topbar">
    <div class="brand"><strong>SOCIAL LIFE</strong><span>A SOCIOLOGY RPG</span></div>
    <div class="chapter"><b>Chapter 1: Seeing Society</b><span>Foundations · Perspectives · Research Methods</span></div>
    <div class="place"><b>QUEEN CITY</b><span>A city of neighborhoods</span></div>
    <div class="time"><b>Day 1</b><span>☀ Morning</span></div>
  </header>
  <div class="stage">
    <canvas id="game" width="960" height="540" aria-label="Queen City game world"></canvas>
    <nav class="rail" aria-label="Game menu">
      <button data-panel="home">⌂<span>Home</span></button><button data-panel="map">◆<span>Map</span></button><button data-panel="journal">▣<span>Journal</span></button><button data-panel="people">♟<span>People</span></button><button data-panel="concepts">●<span>Concepts</span></button><button data-panel="character">★<span>Character</span></button><button data-panel="help">?<span>Help</span></button>
    </nav>
    <div class="quest"><small>CURRENT QUEST</small><b id="questTitle">Meet Professor Burns</b><span id="questText">Find Professor Burns near the college.</span></div>
    <div id="toast" class="toast hidden"></div>
    <div id="dialogue" class="dialogue hidden">
      <canvas id="portrait" width="64" height="64"></canvas>
      <div class="speech"><div class="speaker" id="speaker"></div><p id="speech"></p><div id="choices"></div><small id="continueHint">SPACE / ENTER</small></div>
    </div>
    <div class="mobile-controls" aria-label="Touch controls">
      <div class="dpad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div>
      <button id="actionButton" class="action">A</button>
    </div>
  </div>
  <div id="panel" class="panel hidden"><div class="panel-inner"><button id="closePanel" class="close">×</button><div id="panelContent"></div></div></div>
</div>
<script src="game.js"></script></body></html>
